<!DOCTYPE html>
<html>
<head>
    <title>Bill Generator</title>

    <style>
        .card {
            width: 300px;
            padding: 20px;
            border: 1px solid black;
            border-radius: 10px;
            margin: 50px auto;
            font-family: Arial;
        }

        .product {
            display: flex;
            align-items: center;
            margin: 10px 0;
        }

        .product img {
            width: 40px;
            height: 40px;
            margin-right: 10px;
            object-fit: cover;
            border-radius: 5px;
        }

        input, button {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            cursor: pointer;
        }

        #bill {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>Bill Generator</h2>

    <div class="product">
        <img src="https://images.unsplash.com/photo-1544787219-7f47ccb76574?w=100">
        <span>Tea - ₹120</span>
    </div>

    <div class="product">
        <img src="https://images.unsplash.com/photo-1512568400610-62da28bc8a13?w=100">
        <span>Coffee - ₹500</span>
    </div>

    <div class="product">
        <img src="https://images.unsplash.com/photo-1563298723-dcfebaa392e3?w=100">
        <span>Ice - ₹500</span>
    </div>

    <div class="product">
        <img src="https://images.unsplash.com/photo-1556911220-e15b29be8c8f?w=100">
        <span>Sugar - ₹700</span>
    </div>

    <input type="text" id="product" placeholder="Enter your product">

    <input type="number" id="quantity" placeholder="Enter quantity">

    <button onclick="generateBill()">Generate Bill</button>

    <div id="bill"></div>

</div>


<script>

function generateBill() {

    let product = document.getElementById("product").value;
    let quantity = document.getElementById("quantity").value;

    let price;

    if (product == "tea") {
        price = 120;
    }
    else if (product == "coffee") {
        price = 500;
    }
    else if (product == "ice") {
        price = 500;
    }
    else if (product == "sugar") {
        price = 700;
    }
    else {
        document.getElementById("bill").innerHTML = "Product not available";
        return;
    }

    let total = price * quantity;

    document.getElementById("bill").innerHTML =
        "<h3>Bill</h3>" +
        "Product: " + product + "<br>" +
        "Price: ₹" + price + "<br>" +
        "Quantity: " + quantity + "<br>" +
        "<b>Total Amount: ₹" + total + "</b>";
}

</script>

</body>
</html>
